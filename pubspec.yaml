
name: colorsortmaster

description: "ARKTECH COLOR SORT MASTER - Premium Color Sorting Puzzle Game by ARKTECH SOLUTIONS."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  shared_preferences: ^2.5.3

  audioplayers: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/RobotoVariable.ttf

    - family: Noto Sans Symbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols.ttf
