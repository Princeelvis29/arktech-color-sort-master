
workflows:
  android-debug:
    name: ARKTECH COLOR SORT MASTER - Android CI
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Check Flutter environment
        script: |
          flutter --version
          flutter doctor -v

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Analyze source code
        script: |
          flutter analyze

      - name: Run unit tests
        script: |
          flutter test

      - name: Build Android Debug APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
